# Emby Keeper Workflow Add Frontend Feature Or Module

## Action

Follow the add-frontend-feature-or-module workflow:
1. Add new Vue components (in src/components or src/components/ui).
2. Add new view files (in src/views).
3. Add or update composables (in src/composables).
4. Update router.ts to register new routes if needed.
5. Update types and utility files.
6. Update configuration files (e.g., package.json, tsconfig.json, vite.config.ts).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: frontend/src/components/*.vue, frontend/src/components/ui/*.vue, frontend/src/views/*.vue

