# Emby Keeper Workflow Add New Api Service

## Action

Follow the add-new-api-service workflow:
1. Create a new API directory or module.
2. Add multiple handler files for different API endpoints.
3. Add an __init__.py to the new API module.
4. Update or create a main entry point (e.g., cli.py or app.py) to register the new API.
5. Optionally add configuration or system files for the API.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: embykeeper/api/__init__.py, embykeeper/api/*.py, embykeeper/cli.py

